name: CSS validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  css:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'

      - name: Install locked CSS validator
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Parse theme CSS (without reformatting)
        run: |
          test -s theme.css
          ./node_modules/.bin/prettier theme.css > /dev/null
